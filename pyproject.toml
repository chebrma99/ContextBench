[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbench"
version = "0.1.0"
description = "Benchmark framework for evaluating LLM context strategies in software ticket triage."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "ContextBench Contributors" }
]
license = { text = "MIT" }
keywords = ["llm", "benchmark", "context-engineering", "rag", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40.0", "pytest>=8.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
contextbench = "contextbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["contextbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
